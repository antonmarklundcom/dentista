<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..500&family=Inter+Tight:wght@400;500&display=swap">
<style>
:root{
  --font-display:'Fraunces',Georgia,serif;--font-text:'Inter Tight',system-ui,sans-serif;
  --base:#F7F4ED;--ink:#14241E;--accent:#C2603A;
  --accent-ink:#A75332;          /* härledd: accentfärgad TEXT + CTA-fyllning, klarar 4.5:1 */
  --surface:#FFFFFF;
  --ink-70:color-mix(in srgb,var(--ink) 70%,transparent);
  --ink-55:color-mix(in srgb,var(--ink) 55%,transparent);
  --hairline:color-mix(in srgb,var(--ink) 10%,transparent);
  --hairline-strong:color-mix(in srgb,var(--ink) 18%,transparent);
  --t--1:0.812rem;--t-0:1.0625rem;--t-1:1.383rem;--t-4:3.037rem;--t-6:5.133rem;
  --s-2:.5rem;--s-3:.75rem;--s-4:1rem;--s-6:1.5rem;--s-8:2rem;--s-12:3rem;--s-16:4rem;
  --r-sm:6px;--dur-fast:180ms;--ease-io:cubic-bezier(.4,0,.2,1);
  --shadow-2:0 2px 4px rgb(0 0 0/.06), 0 16px 40px rgb(0 0 0/.10);
  --container:1200px;--gutter:clamp(1rem,5vw,3rem);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font:var(--t-0)/1.65 var(--font-text);
  min-height:100svh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
main{max-width:var(--container);padding:var(--s-16) var(--gutter)}
h1{font-family:var(--font-display);font-weight:450;letter-spacing:-.03em;line-height:1.02;
  font-size:clamp(var(--t-4),6vw,var(--t-6));margin:0 0 var(--s-6)}
p{color:var(--ink-70);max-width:52ch;margin:0 0 var(--s-4)}
.eyebrow{font-size:var(--t--1);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);
  font-weight:500;margin:0 0 var(--s-4);display:block}
.btns{display:flex;flex-wrap:wrap;gap:var(--s-3);margin-top:var(--s-8);align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:48px;
  padding:0 var(--s-6);border-radius:var(--r-sm);font:500 var(--t-0)/1.2 var(--font-text);
  text-decoration:none;border:0;transition:transform var(--dur-fast) var(--ease-io),box-shadow var(--dur-fast) var(--ease-io)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.btn--wa{background:var(--ink);color:var(--base)}
.btn--wa svg{fill:#25D366}
.back{font-size:var(--t--1);color:var(--ink-70);text-decoration:none;border-bottom:1px solid var(--hairline-strong);padding-bottom:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.btn:hover{transform:none}}
</style>
</head>
<body>
<main>
  <span class="eyebrow">Dentista.com.py</span>
  <h1>Recibimos tu consulta</h1>

  <div class="btns">

  </div>
</main>

</body>
</html>
